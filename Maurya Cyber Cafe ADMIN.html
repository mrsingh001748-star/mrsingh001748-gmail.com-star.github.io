function pad10(n){var s=String(n);while(s.length<10)s='0'+s;return s}
function buildPdf(imgs){
  var enc=new TextEncoder(),parts=[],off=0,xref=[],n=imgs.length,i,k;
  function push(x){var b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length}
  function obj(id,body){xref[id]=off;push(id+' 0 obj\n'+body+'\nendobj\n')}
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  var kids=[];for(i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  for(i=0;i<n;i++){
    var im=imgs[i],land=im.w>im.h,PW=land?842:595,PH=land?595:842,m=24;
    var s=Math.min((PW-2*m)/im.w,(PH-2*m)/im.h),dw=im.w*s,dh=im.h*s,x=(PW-dw)/2,y=(PH-dh)/2;
    obj(3+3*i,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Contents '+(4+3*i)+' 0 R /Resources << /XObject << /Im0 '+(5+3*i)+' 0 R >> >> >>');
    var c='q '+dw.toFixed(2)+' 0 0 '+dh.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm /Im0 Do Q';
    obj(4+3*i,'<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream');
    xref[5+3*i]=off;
    push((5+3*i)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n');
    push(im.bytes);push('\nendstream\nendobj\n');
  }
  var size=3+3*n,xo=off;
  push('xref\n0 '+size+'\n0000000000 65535 f \n');
  for(k=1;k<size;k++)push(pad10(xref[k])+' 00000 n \n');
  push('trailer\n<< /Size '+size+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

    var f=$('logoFile').files&&$('logoFile').files[0],lmsg=$('logoMsg');
    if(!f){lmsg.textContent='Pehle photo chunein.';return}
    if(!/^image\//.test(f.type)){lmsg.textContent='Ye photo nahi hai.';return}
    var img=new Image(),url=URL.createObjectURL(f);
    img.onload=function(){
      var S=256,c=document.createElement('canvas');c.width=S;c.height=S;
      var x=c.getContext('2d'),m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
      x.drawImage(img,sx,sy,m,m,0,0,S,S);
      URL.revokeObjectURL(url);
      var data=c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',0.85);
      change(function(){STATE.logo=data},lmsg,'Photo lag gayi.');
    };
    img.onerror=function(){URL.revokeObjectURL(url);lmsg.textContent='Ye photo khul nahi paayi. Dusri photo chunein.'};
    img.src=url;
  });
  $('logoDel').addEventListener('click',function(){change(function(){delete STATE.logo},$('logoMsg'),'Photo hat gayi.')});
  $('lShow').addEventListener('click',function(){var p=$('lPw'),h=p.type==='password';p.type=h?'text':'password';this.textContent=h?'Chhupayein':'Dikhayein'});
  $('lSkip').addEventListener('click',function(){location.hash='#home'});
  $('lockForm').addEventListener('submit',function(e){
    e.preventDefault();
    if(stage===2&&AUTH&&AUTH.pin){
      hexHash(AUTH.pin.salt,'pin',$('lCode').value.trim()).then(function(h){
        if(h===AUTH.pin.hash){setUnlocked(true,remMem);lm.textContent='';$('lPw').value='';$('lCode').value='';showAdmin(true)}
        else{lm.textContent='Code galat hai.';$('lCode').value=''}
      });
      return;
    }
    var id=$('lId').value.trim(),pw=$('lPw').value,rem=$('lRem').checked;
    if(!AUTH){
      if(pw.length<6){lm.textContent='Password kam se kam 6 akshar ka rakhein.';return}
      if(pw!==$('lPw2').value){lm.textContent='Dono password alag hain.';return}
      var salt=newId('s');
      hexHash(salt,id,pw).then(function(h){
        change(function(){STATE.auth={id:id,salt:salt,hash:h}},lm,'');
      });
    }else{
      hexHash(AUTH.salt,id,pw).then(function(h){
        if(id.toLowerCase()===String(AUTH.id).toLowerCase()&&h===AUTH.hash){
          if(AUTH.pin&&AUTH.pin.hash){remMem=rem;goStage2()}
          else{setUnlocked(true,rem);lm.textContent='';$('lPw').value='';showAdmin(true)}
        }
        else lm.textContent='ID ya password galat hai.';
      });
    }
  });
  $('logout').addEventListener('click',function(){setUnlocked(false);showAdmin(false);location.hash='#home'});
}

(async function(){
  try{
    if(!window.claude||!claude.use)return;
    try{dl=await claude.use('downloads')}catch(e){}
    var user=await claude.use('user');
    var art=await claude.use('artifact');
    if(!art||!user||!user.canEdit||!user.canEdit())return;
    artifact=art;
    setupLock();
  }catch(err){}
})();
})();</script>
